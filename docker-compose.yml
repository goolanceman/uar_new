services:
  postgres:
    image: postgres:16-alpine
    container_name: uar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uar
      POSTGRES_PASSWORD: uar_dev_password
      POSTGRES_DB: uar
    ports:
      - "5433:5432"
    volumes:
      - uar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uar -d uar"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── UAR standalone backend API (Express + Prisma → postgres service) ────
  # Data (schema push / seed / migration) lives in the uar_pgdata volume, so
  # the API container only needs to connect and serve.
  #   schema/seed : docker compose exec api bunx prisma db push
  #   logs        : docker compose logs -f api
  api:
    build: ./backend
    container_name: uar-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Inside the compose network the DB hostname is the service name
      # (`postgres`), NOT localhost — overrides the value in backend/.env.
      DATABASE_URL: postgresql://uar:uar_dev_password@postgres:5432/uar?schema=public
      PORT: 3005
      # Uploaded files: bind-mounted host dir so files uploaded before
      # containerisation keep working (files/[id]/file serves from here).
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:8090,http://127.0.0.1:8090,http://localhost:9090,http://127.0.0.1:9090,http://192.168.1.8:9090"
    ports:
      - "3005:3005"
      - "6001:6001" # Pusher-protocol WebSocket (mobile chat real-time)
    volumes:
      - ./upload:/app/uploads
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://localhost:3005/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  uar_pgdata:
